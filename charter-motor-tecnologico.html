<title>Charter Motor Tecnológico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: barra superior fija con una pestaña por charter (general + 4 iniciativas). Cada charter abre con una banda azul institucional con trama de plano y sigue con secciones claras en flujo. Identidad de la palanca Motor Tecnológico; un solo aspecto, independiente del tema del visor. */
:root{
  color-scheme:light;
  --navy:#003366; --navy-d:#00264d; --navy-dd:#00182f; --blue:#1d4f86; --blue-l:#4f86c6; --blue-ll:#b8cfe9; --ice:#edf3fa;
  --bg:#f5f7fa; --white:#ffffff; --ink:#0e1c2b; --muted:#56667b; --line:#d9e1eb; --track:#e3e9f1;
  --gold:#c08a1e; --gold-l:#f2d48e; --crit:#b3261e; --crit-soft:#f9e2e0; --warn:#b5651d; --warn-soft:#fbeedd; --ok:#2c7a4b; --ok-soft:#e2f1e8;
  --on-dark:#ffffff; --on-dark-m:#b6c9df;
  --core:#1d4f86; --datos:#0a6c87; --ia:#4a4c9c; --vigilancia:#2b7a66; --general:#c08a1e;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.08;text-wrap:balance}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- Barra superior ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--navy-dd)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy-dd);border-bottom:1px solid rgba(255,255,255,.08)}
.tb-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;gap:2px;padding-block:10px;flex:none}
.brand b{font:800 18px/1.1 var(--f-display);font-stretch:80%;color:#fff}
.brand span{font:500 11px/1 var(--f-mono);color:var(--on-dark-m);letter-spacing:.04em}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;margin-left:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:transparent;color:var(--on-dark-m);font:600 14px/1 var(--f-body);padding:20px 12px 18px;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center;border-bottom:3px solid transparent;transition:color .2s,border-color .2s}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--tc)}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--tc)}
@media(max-width:860px){.brand{display:none}.tabs{margin-left:0}}

/* ---------- Bandas y secciones ---------- */
.inner{max-width:1180px;margin:0 auto;padding-block:56px;padding-left:max(clamp(16px,4vw,48px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,48px),env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px;position:relative}
.sec{background:var(--bg)}
.sec:nth-of-type(even){background:var(--white)}
.sec + .sec{border-top:1px solid var(--line)}
.sec:nth-of-type(even) .card,.sec:nth-of-type(even) .tile,.sec:nth-of-type(even) .tbl-wrap,.sec:nth-of-type(even) .rfi,.sec:nth-of-type(even) .epic{background:var(--bg)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.head>div{min-width:0}
.kick{font:600 13px/1.3 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--blue))}
.h2{font-size:clamp(28px,3.4vw,40px);font-weight:780;font-stretch:84%;letter-spacing:-.01em;margin-top:8px;color:var(--ink);max-width:26ch}
.lede{font-size:18px;color:var(--muted);max-width:46ch;line-height:1.4}
.pmi,.agil{display:inline-flex;align-items:center;font:600 11px/1 var(--f-mono);letter-spacing:.06em;padding:5px 8px;border-radius:6px;white-space:nowrap;vertical-align:middle}
.pmi{background:var(--ice);color:var(--navy);border:1px solid var(--blue-ll)}
.agil{background:var(--gold-l);color:var(--navy-dd)}
.tag{display:inline-flex;align-items:center;gap:7px;font:600 12.5px/1 var(--f-body);letter-spacing:.03em;padding:6px 11px;border-radius:999px;white-space:nowrap}
.tag.ghost{background:rgba(255,255,255,.1);color:var(--on-dark);border:1px solid rgba(255,255,255,.2)}
.tag.prop{background:var(--gold);color:var(--navy-dd)}
.tbd{color:var(--warn);font-style:italic}

/* ---------- Portada ---------- */
.band{color:var(--on-dark);background-color:var(--navy);
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:96px 96px,96px 96px,16px 16px,16px 16px;position:relative;overflow:hidden}
.band.init{background-color:var(--navy-dd);background-image:radial-gradient(1100px 650px at 0% 100%,color-mix(in srgb,var(--c) 70%,transparent),transparent 70%),linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:auto,96px 96px,96px 96px}
.band .kick{color:var(--on-dark-m)}
.band h1{font-size:clamp(54px,8.6vw,100px);font-weight:800;font-stretch:78%;letter-spacing:-.02em;line-height:.95;color:#fff}
.band .sub{font:500 clamp(19px,2.2vw,26px)/1.3 var(--f-display);font-stretch:92%;color:var(--on-dark-m);max-width:30ch}
.hero-top{display:flex;flex-direction:column;gap:18px;max-width:640px;position:relative;z-index:1}
.engine{position:absolute;right:clamp(16px,4vw,48px);top:40px;width:min(28vw,320px);height:auto;opacity:.95}
.engine .ring{transform-origin:260px 260px}
.engine .r1{animation:spin 40s linear infinite}
.engine .r2{animation:spin 60s linear infinite reverse}
.engine .r3{animation:spin 26s linear infinite}
.ficha{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14);border-radius:14px;overflow:hidden;margin:0;position:relative;z-index:1}
.ficha div{background:rgba(0,24,47,.72);padding:14px 16px;display:flex;flex-direction:column;gap:5px;min-width:0}
.ficha dt{font:600 11.5px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--on-dark-m)}
.ficha dd{margin:0;font:600 16px/1.3 var(--f-body);color:#fff}
.ficha dd small{display:block;font-weight:400;font-size:13.5px;color:var(--gold-l)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;position:relative;z-index:1}
.stat{border-top:3px solid var(--gold);padding-top:12px}
.stat b{display:block;font:800 clamp(30px,3.6vw,42px)/1 var(--f-display);font-stretch:76%;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;color:var(--gold-l);font-size:.62em;margin:0 4px}
.stat span{display:block;font-size:14.5px;color:var(--on-dark-m);margin-top:6px}

/* ---------- Tarjetas y rejillas ---------- */
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px 26px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card .ml{font:600 12.5px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.mv{white-space:nowrap;font:800 clamp(40px,5vw,56px)/1 var(--f-display);font-stretch:76%;color:var(--navy);display:flex;align-items:baseline;gap:12px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.mv em{font-style:normal;color:var(--gold);font-size:.6em}
.bar2{display:flex;flex-direction:column;gap:9px;margin-top:auto}
.bar2 .row{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;font:600 13px/1 var(--f-mono);color:var(--muted)}
.bar2 .t{height:14px;background:var(--track);border-radius:5px;position:relative;overflow:hidden}
.bar2 .f{position:absolute;inset:0 auto 0 0;border-radius:5px}
.quote{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;background:var(--navy);color:var(--on-dark);border-radius:16px;padding:20px 26px}
.quote .qm{font:800 66px/0.6 var(--f-display);color:var(--gold);padding-top:22px}
.quote p{font:560 21px/1.4 var(--f-display);font-stretch:94%}
.quote p b{color:var(--gold-l)}
.stmt-l{font:600 13px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.stmt{font:580 clamp(20px,2.2vw,25px)/1.38 var(--f-display);font-stretch:92%;color:var(--ink)}
.obj-gen{background:var(--navy);color:#fff;border-radius:16px;padding:24px 28px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start}
.obj-gen .ml{font:600 12.5px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-l);padding-top:6px;white-space:nowrap}
.obj-gen p{font:560 clamp(18px,2vw,22px)/1.4 var(--f-display);font-stretch:94%}
.oe{appearance:none;border:0;cursor:pointer;text-align:left;background:var(--white);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 4px 0 var(--lc),0 0 0 1px var(--line);transition:transform .25s,box-shadow .25s;min-width:0}
.oe:hover{transform:translateY(-4px);box-shadow:inset 0 4px 0 var(--lc),0 12px 28px rgba(0,40,80,.12)}
.oe .n{font:800 30px/1 var(--f-display);font-stretch:76%;color:var(--lc)}
.oe h3{font-size:20px;font-weight:760;font-stretch:88%}
.oe p{font-size:15px;color:var(--muted);line-height:1.42}
.oe .go{font:600 13px/1 var(--f-body);color:var(--lc);margin-top:auto}

/* ---------- Balance ---------- */
.tbl-wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line);background:var(--white)}
.mtx{display:grid;grid-template-columns:minmax(220px,320px) repeat(4,minmax(96px,1fr));min-width:720px}
.mtx .hc{font:600 12.5px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 10px;text-align:center;border-bottom:1px solid var(--line);background:var(--ice)}
.mtx .hc:first-child{text-align:left;padding-left:22px}
.mtx .rn{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:3px;box-shadow:inset 5px 0 0 var(--rc)}
.mtx .rn b{font:740 18px/1.15 var(--f-display);font-stretch:88%}
.mtx .rn span{font-size:14px;color:var(--muted)}
.mtx .cell{display:grid;place-items:center;border-bottom:1px solid var(--line);position:relative}
.mtx .last{border-bottom:0}
.dot{width:28px;height:28px;border-radius:50%;position:relative;z-index:1;display:grid;place-items:center}
.dot.d2{background:var(--rc)}
.dot.d2::after{content:"";width:7px;height:12px;border-right:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(45deg) translate(-1px,-2px)}
.dot.d1{background:var(--white);border:3px solid var(--rc);background-image:linear-gradient(90deg,var(--rc) 50%,transparent 50%)}
.dot.d0{background:var(--white);border:3px dashed var(--crit)}
.legend{display:flex;gap:20px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend .dot{width:18px;height:18px;--rc:var(--blue)}
.legend .dot.d2::after{width:5px;height:8px;border-width:2px}
.legend .dot.d1,.legend .dot.d0{border-width:2px}
.gaps{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gaps .gl{font:600 13px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--crit);margin-right:6px}
.gaps span.g{background:var(--crit-soft);color:var(--crit);border-radius:999px;padding:9px 15px;font:600 15px/1 var(--f-body)}

/* ---------- Alcance ---------- */
.scope h3{font-size:19px;font-weight:760;font-stretch:88%;display:flex;align-items:center;gap:10px}
.scope h3 i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font:800 14px/1 var(--f-display);font-style:normal;background:var(--hc)}
.si{display:grid;grid-template-columns:6px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.si:first-of-type{border-top:0}
.si::before{content:"";border-radius:3px;background:var(--lc,var(--hc))}
.si b{font:700 16px/1.3 var(--f-body)}
.si p{font-size:15px;color:var(--muted);margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font:600 12px/1 var(--f-mono);padding:5px 8px;border-radius:6px;background:color-mix(in srgb,var(--lc,var(--blue)) 12%,var(--white));color:var(--lc,var(--blue))}

/* ---------- Modelo híbrido ---------- */
.lanes{display:grid;gap:16px}
.lane{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:stretch}
.lane-h{border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.lane-h b{font:800 22px/1.05 var(--f-display);font-stretch:82%}
.lane-h span{font-size:14px;line-height:1.35}
.lane.p .lane-h{background:var(--navy);color:#fff}
.lane.p .lane-h span{color:var(--on-dark-m)}
.lane.s .lane-h{background:var(--gold);color:var(--navy-dd)}
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;min-width:0}
.step{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.lane.p .step{box-shadow:inset 0 3px 0 var(--navy)}
.lane.s .step{box-shadow:inset 0 3px 0 var(--gold)}
.step .w{font:600 12px/1.2 var(--f-mono);color:var(--muted)}
.step h4{font-size:17px;font-weight:740;font-stretch:90%}
.step p{font-size:14px;color:var(--muted);line-height:1.38}
.loop{display:inline-block;animation:spin 6s linear infinite;color:var(--gold)}
.bridge{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px}
.bridge div{grid-column:2;display:flex;align-items:center;gap:14px;border:2px dashed var(--gold);border-radius:12px;padding:12px 18px;font-size:15.5px;background:color-mix(in srgb,var(--gold-l) 22%,var(--white))}
.bridge b{font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:15px;min-width:680px}
.tbl th{font:600 12px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 16px;background:var(--ice);border-bottom:1px solid var(--line)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td b{font-weight:700}
.tbl .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.role{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.role .rt{display:flex;justify-content:space-between;gap:8px;align-items:center}
.role h4{font-size:17px;font-weight:740;font-stretch:90%}
.role .who{font:600 13.5px/1.3 var(--f-body);color:var(--blue)}
.role p{font-size:14.5px;color:var(--muted);line-height:1.38}
.dod{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start;background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 30%,var(--white));border-radius:14px;padding:18px 22px}
.dod .ml{font:700 13px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ok);padding-top:3px;white-space:nowrap}
.dod ol{margin:0;padding-left:20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 28px;font-size:15.5px}

/* ---------- Hoja de ruta ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fb{appearance:none;border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:8px 14px;font:600 14px/1 var(--f-body);cursor:pointer;display:inline-flex;gap:8px;align-items:center;color:var(--ink)}
.fb i{width:9px;height:9px;border-radius:50%;background:var(--fc)}
.fb[aria-pressed="true"]{border-color:var(--fc);background:color-mix(in srgb,var(--fc) 12%,var(--white))}
.rm{min-width:820px}
.rm-row{display:grid;grid-template-columns:minmax(230px,300px) minmax(0,1fr);border-bottom:1px solid var(--line)}
.rm-row:last-child{border-bottom:0}
.rm-row[hidden]{display:none}
.rm-l{padding:10px 18px;display:flex;flex-direction:column;justify-content:center;gap:2px;box-shadow:inset 4px 0 0 var(--lc,transparent);min-width:0}
.rm-l b{font:700 14.5px/1.25 var(--f-body)}
.rm-l span{font:500 11.5px/1.2 var(--f-mono);color:var(--muted)}
.trk{position:relative;min-height:46px;background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:20% 100%}
.trk::after{content:"";position:absolute;top:0;bottom:0;left:var(--hoy);width:2px;background:var(--gold);opacity:.7}
.rm-h .trk{display:grid;grid-template-columns:repeat(5,1fr);background:var(--ice);min-height:0}
.rm-h .trk span{font:600 12px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 10px;border-left:1px solid var(--line)}
.rm-h .rm-l{background:var(--ice);font:600 12px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rm-h .hoy{position:absolute;left:var(--hoy);top:100%;transform:translate(-50%,4px);background:var(--gold);color:var(--navy-dd);font:700 10.5px/1 var(--f-mono);padding:3px 6px;border-radius:4px;z-index:2;white-space:nowrap}
.rm-g .rm-l{background:color-mix(in srgb,var(--lc) 8%,var(--white))}
.rm-g .rm-l b{font:760 16px/1.2 var(--f-display);font-stretch:88%;color:var(--lc)}
.rm-g .trk{background-color:color-mix(in srgb,var(--lc) 4%,var(--white));min-height:38px}
.bar{position:absolute;top:50%;height:20px;margin-top:-10px;border-radius:6px;background:var(--lc);transform-origin:left center}
.bar.ph{height:24px;margin-top:-12px;display:flex;align-items:center;padding:0 10px;color:#fff;font:600 12px/1 var(--f-body);white-space:nowrap;overflow:hidden}
.ms{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;background:var(--gold);transform:rotate(45deg);border:2px solid var(--white);box-shadow:0 0 0 1px var(--gold);z-index:2}
.ms-l{position:absolute;top:50%;transform:translate(12px,-50%);font:600 12px/1.15 var(--f-body);color:var(--ink);white-space:nowrap;padding:3px 7px;z-index:2;background:var(--white);border:1px solid var(--line);border-radius:5px}
.ms-l.left{transform:translate(calc(-100% - 12px),-50%)}

/* ---------- Indicadores ---------- */
.kpi-n{font-weight:700}
.kpi-n small{display:block;font-weight:400;color:var(--muted);font-size:13.5px;margin-top:2px}
.ini-pill{display:inline-flex;align-items:center;gap:6px;font:600 12.5px/1.2 var(--f-body);color:var(--lc);white-space:nowrap}
.ini-pill i{width:8px;height:8px;border-radius:50%;background:var(--lc)}
.bm{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bm .b{font:600 14px/1 var(--f-mono);color:var(--muted)}
.bm .m{font:700 14px/1 var(--f-mono);color:var(--navy)}
.bm i{font-style:normal;color:var(--gold)}

</div></header>

<script>
(function(){
const D = JSON.parse(document.getElementById('datos').textContent);
const INI = D.iniciativas, G = D.general, Q = D.trimestres, M = D.meta;
const byId = {}; INI.forEach(i => byId[i.id] = i);
const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const col = id => `var(--${id})`;
const tbd = s => /por definir|por designar|por confirmar|sin medir/i.test(s) ? `<span class="tbd">${esc(s)}</span>` : esc(s);
const method = m => m === 'pmi' ? '<span class="pmi">PMI</span>' : '<span class="agil">SCRUM</span>';
const ORIG = {pal: ['pal', 'Palanca'], pro: ['pro', 'Propuesta'], c25: ['c25', 'Charter 2025']};
const sevOf = (p, i) => p * i >= 6 ? 3 : p * i >= 3 ? 2 : 1;
const SEVTXT = {3: 'Alta', 2: 'Media', 1: 'Baja'};
const fmtCOP = n => (n / 1e6).toFixed(1).replace('.', ',') + ' M';
const nEpicas = INI.reduce((a, i) => a + i.epicas.length, 0);

const TABS = [{id: 'motor', label: 'Motor Tecnológico', c: 'var(--gold)'}].concat(INI.map(i => ({id: i.id, label: `${+i.num} · ${i.corto}`, c: col(i.id)})));

function sec(kick, title, body, o={}){
  return `<section class="sec" ${o.c ? `style="--c:${o.c}"` : ''}><div class="inner">
    <div class="head"><div><div class="kick a">${kick}</div><h2 class="h2 a" style="--i:1">${title}</h2></div>${o.lede ? `<p class="lede a" style="--i:2">${o.lede}</p>` : ''}</div>
    ${body}</div></section>`;
}

/* ---------- Bloques compartidos ---------- */
function kpiTable(rows, showIni){
  return `<div class="tbl-wrap a" style="--i:3"><table class="tbl kpi-tbl">
    <thead><tr><th>Indicador</th>${showIni ? '<th>Iniciativa</th>' : ''}<th>Línea base → meta 2027</th><th>Meta 2028</th><th>Origen</th></tr></thead>
    <tbody>${rows.map(k => `<tr data-ini="${k.ini}">
      <td class="kpi-n">${esc(k.n)}<small>${esc(k.d)}</small></td>
      ${showIni ? `<td><span class="ini-pill" style="--lc:${k.ini === 'general' ? 'var(--gold)' : col(k.ini)}"><i></i>${k.ini === 'general' ? 'Palanca' : esc(byId[k.ini].corto)}</span></td>` : ''}
      <td><span class="bm"><span class="b">${esc(k.b)}</span><i>→</i><span class="m">${tbd(k.m27)}</span></span></td>
      <td class="num">${tbd(k.m28)}</td>
      <td><span class="orig ${ORIG[k.o][0]}">${ORIG[k.o][1]}</span></td></tr>`).join('')}</tbody></table></div>`;
}

function roadmap(rows, withFilters){
  const head = `<div class="rm-row rm-h"><div class="rm-l">Épica</div><div class="trk" style="--hoy:${M.hoy * 100}%">${Q.map(q => `<span>${esc(q)}</span>`).join('')}<b class="hoy">HOY</b></div></div>`;
  let i = 0;
  const body = rows.map(r => {
    const left = r.d * 20, w = (r.h - r.d + 1) * 20;
    if (r.grupo) return `<div class="rm-row rm-g" data-ini="${r.ini}" style="--lc:${r.c}"><div class="rm-l"><b>${esc(r.n)}</b></div><div class="trk" style="--hoy:${M.hoy * 100}%"></div></div>`;
    i++;
    const right = left + w;
    const ms = r.hito ? `<span class="ms pop" style="left:${right}%;--i:${i}"></span><span class="ms-l ${right > 70 ? 'left' : ''}" style="left:${right > 70 ? right - 1 : right}%">${esc(r.hito)}</span>` : '';
    return `<div class="rm-row" data-ini="${r.ini}" style="--lc:${r.c}" title="${esc(r.e || '')}"><div class="rm-l"><b>${esc(r.n)}</b><span>${esc(r.id || '')}</span></div>
      <div class="trk" style="--hoy:${M.hoy * 100}%"><span class="bar gx ${r.ph ? 'ph' : ''}" style="left:${left}%;width:${w}%;--i:${i}">${r.ph ? esc(r.w) : ''}</span>${ms}</div></div>`;
  }).join('');
  return `<div class="tbl-wrap a" style="--i:3"><div class="rm">${head}${body}</div></div>`;
}

function filters(group){
  return `<div class="filters a" style="--i:2" data-group="${group}"><button class="fb" aria-pressed="true" data-f="all" style="--fc:var(--navy)"><i></i>Todas</button>${INI.map(i => `<button class="fb" aria-pressed="false" data-f="${i.id}" style="--fc:${col(i.id)}"><i></i>${esc(i.corto)}</button>`).join('')}</div>`;
}

function engine(){
  return `<svg class="engine" viewBox="0 0 520 520" aria-hidden="true">
    <g class="ring r1"><circle cx="260" cy="260" r="230" fill="none" style="stroke:var(--core)" stroke-width="16" stroke-dasharray="300 61" stroke-linecap="round"/></g>
    <g class="ring r2"><circle cx="260" cy="260" r="190" fill="none" style="stroke:var(--datos)" stroke-width="16" stroke-dasharray="220 78" stroke-linecap="round"/></g>
    <g class="ring r3"><circle cx="260" cy="260" r="150" fill="none" style="stroke:var(--ia)" stroke-width="16" stroke-dasharray="160 75" stroke-linecap="round"/></g>
    <g class="ring r1"><circle cx="260" cy="260" r="110" fill="none" style="stroke:var(--vigilancia)" stroke-width="16" stroke-dasharray="110 62" stroke-linecap="round"/></g>
    <circle cx="260" cy="260" r="64" style="fill:var(--gold)"/><circle cx="260" cy="260" r="22" style="fill:var(--navy)"/></svg>`;
}

function nextBtn(id){
  const t = TABS.find(x => x.id === id);
  return `<div class="next"><div class="inner"><button class="next-btn" data-go="${t.id}" style="--nc:${t.c}"><span class="label">Siguiente</span><b>${esc(t.label)}</b><span class="arr">→</span></button></div></div>`;
}

/* ---------- Charter general ---------- */
function panelMotor(){
  const hero = `<section class="band"><div class="inner">${engine()}
    <div class="hero-top">
      <div class="kick a">Project Charter · ${esc(M.revision)} · ${esc(M.estado)} · ${esc(M.fecha)}</div>
      <h1 class="a" style="--i:1">Motor<br>Tecnológico</h1>
      <p class="sub a" style="--i:2">Herramientas, datos e IA, en los proyectos y en la oficina. Charter 2027 con visión a 2028.</p>
    </div>
    <div class="stats a" style="--i:3">
      <div class="stat"><b>48,5<em>→</em>100</b><span>Ingresos en cinco años, millones de USD</span></div>
      <div class="stat"><b>30–35 %<em>→</em>20 %</b><span>Costo de administrar los proyectos</span></div>
      <div class="stat"><b><span class="cnt" data-n="4">4</span> · <span class="cnt" data-n="${nEpicas}">${nEpicas}</span></b><span>Iniciativas y épicas en 2027</span></div>
      <div class="stat"><b>21</b><span>Sprints de 2 semanas, feb–nov 2027</span></div>
    </div>
    <dl class="ficha a" style="--i:4">${G.ficha.map(f => `<div><dt>${esc(f[0])}</dt><dd>${esc(f[1])}${f[2] ? `<small>${esc(f[2])}</small>` : ''}</dd></div>`).join('')}</dl>
  </div></section>`;

  const caso = sec('Caso de negocio', 'El mandato: crecer sin crecer la estructura', `
    <div class="g2">
      <div class="card a" style="--i:2"><div class="ml">Ingresos en cinco años · millones de USD</div>
        <div class="mv"><span>48,5</span><em>→</em><span class="cnt" data-n="100">100</span></div>
        <p>Sin crecer sustancialmente la estructura corporativa.</p>
        <div class="bar2"><div class="row"><span>2026</span><div class="t"><div class="f gx" style="width:48.5%;background:var(--blue-ll)"></div></div></div><div class="row"><span>2031</span><div class="t"><div class="f gx" style="width:100%;background:var(--navy);--i:1"></div></div></div></div>
      </div>
      <div class="card a" style="--i:3"><div class="ml">Costo de administrar los proyectos</div>
        <div class="mv">30–35 %<em>→</em><span><span class="cnt" data-n="20">20</span> %</span></div>
        <p>Cada punto que baja es competitividad directa.</p>
        <div class="bar2"><div class="row"><span>Hoy</span><div class="t"><div class="f gx" style="width:100%;background:var(--crit);opacity:.75"></div></div></div><div class="row"><span>Meta</span><div class="t"><div class="f gx" style="width:57%;background:var(--ok);--i:1"></div></div></div></div>
      </div>
    </div>
    <div class="quote a" style="--i:4"><span class="qm">“</span><p>Hoy el equipo administrativo dedica la mayor parte de su tiempo a <b>reunir datos y producir informes</b>, no a analizarlos. La tecnología debe devolver ese tiempo.</p></div>
    <div class="tbl-wrap a" style="--i:5"><div class="mtx">
      <div class="hc">Balance a octubre de 2026</div><div class="hc">Diagnóstico</div><div class="hc">Plan</div><div class="hc">Ejecución</div><div class="hc">Valor medido</div>
      ${INI.map((x, r) => { const last = r === INI.length - 1 ? ' last' : ''; return `<div class="rn${last}" style="--rc:${col(x.id)}"><b>${esc(x.corto)}</b><span>${esc(x.estado)}</span></div>` + x.balance.map((b, k) => `<div class="cell${last}" style="--rc:${col(x.id)}"><span class="dot d${b} pop" style="--i:${r * 4 + k}"></span></div>`).join(''); }).join('')}
    </div></div>
    <div class="legend a" style="--i:6"><span><i class="dot d2"></i>Hecho</span><span><i class="dot d1"></i>En curso</span><span><i class="dot d0"></i>Pendiente</span></div>
    <div class="gaps a" style="--i:7"><span class="gl">Lo que falta en todas</span><span class="g">Uso real de las herramientas</span><span class="g">Medir el valor</span><span class="g">Capacidad para ejecutar</span><span class="g">Financiación 2027</span></div>
  `, {lede: 'Todas las iniciativas tienen rumbo. Ninguna tiene todavía valor medido: eso es lo que este charter debe cambiar en 2027.'});

  const mvo = sec('Misión, visión y objetivos', 'Hacia dónde va el motor', `
    <div class="g2">
      <div class="a" style="--i:2"><div class="stmt-l">Misión</div><p class="stmt" style="margin-top:10px">${esc(G.mision)}</p></div>
      <div class="a" style="--i:3"><div class="stmt-l">Visión 2028</div><p class="stmt" style="margin-top:10px">${esc(G.vision)}</p></div>
    </div>
    <div class="obj-gen a" style="--i:4"><span class="ml">Objetivo general 2027</span><p>${esc(G.objetivo)}</p></div>
    <div class="g4">${INI.map((x, k) => `<button class="oe a" style="--lc:${col(x.id)};--i:${5 + k}" data-go="${x.id}"><span class="n">${x.num}</span><h3>${esc(x.nombre)}</h3><p>${esc(x.objetivo)}</p><span class="go">Ver charter de la iniciativa →</span></button>`).join('')}</div>
  `, {lede: 'Un objetivo general para la palanca y un objetivo específico por iniciativa, cada uno con su indicador.'});

  const alcance = sec('Alcance', 'Qué entra en 2027 y qué no', `
    <div class="g2 scope">
      <div class="card a" style="--i:2;--hc:var(--ok)"><h3><i>✓</i>Dentro del alcance</h3>
        ${INI.map(x => `<div class="si" style="--lc:${col(x.id)}"><div><b>${x.num} · ${esc(x.nombre)}</b><div class="chips">${x.herramientas.map(h => `<span class="chip">${esc(h)}</span>`).join('')}</div></div></div>`).join('')}
      </div>
      <div class="card a" style="--i:3;--hc:var(--crit)"><h3><i>✕</i>Fuera del alcance</h3>
        ${G.fueraAlcance.map(f => `<div class="si"><div><b>${esc(f[0])}</b><p>${esc(f[1])}</p></div></div>`).join('')}
      </div>
    </div>`, {lede: 'OPUS, Zoho CRM y M365 se suman a Libra y Procore en la iniciativa 1. El detalle de cada alcance está en el charter de cada iniciativa.'});

  const lane = (cls, title, sub, items) => `<div class="lane ${cls} a" style="--i:${cls === 'p' ? 2 : 3}"><div class="lane-h"><b>${title}</b><span>${sub}</span></div>
    <div class="steps">${items.map(s => `<div class="step"><span class="w">${esc(s.w)}</span><h4>${esc(s.n)}</h4><p>${esc(s.p)}</p></div>`).join('')}</div></div>`;
  const modelo = sec('Cómo se gestiona', 'Modelo híbrido: PMI para gobernar, Scrum para entregar', `
    <div class="lanes">
      ${lane('p', 'PMI', 'Qué, cuánto y cuándo: línea base, costo, riesgos y control de cambios.', G.fases)}
      <div class="bridge a" style="--i:3"><div><span class="loop">↻</span><span><b>Punto de unión.</b> ${esc(G.puente)}</span></div></div>
      ${lane('s', 'Scrum', 'Cómo se entrega: backlog por iniciativa y un incremento usable cada 2 semanas.', G.scrum)}
    </div>
    <div class="tbl-wrap a" style="--i:4"><table class="tbl"><thead><tr><th>Evento</th><th>Cadencia</th><th>Participan</th><th>Sale de ahí</th><th>Enfoque</th></tr></thead>
      <tbody>${G.ceremonias.map(c => `<tr><td><b>${esc(c[0])}</b></td><td>${esc(c[1])}</td><td>${esc(c[2])}</td><td>${esc(c[3])}</td><td>${method(c[4])}</td></tr>`).join('')}</tbody></table></div>
    <div class="roles">${G.roles.map((r, k) => `<div class="role a" style="--i:${5 + k}"><div class="rt"><h4>${esc(r[0])}</h4>${method(r[2])}</div><span class="who">${tbd(r[1])}</span><p>${esc(r[3])}</p></div>`).join('')}</div>
    <div class="dod a" style="--i:8"><span class="ml">Definición de terminado</span><ol>${G.dod.map(d => `<li>${esc(d)}</li>`).join('')}</ol></div>
  `, {lede: 'El charter, la línea base y el presupuesto se controlan como en PMI. Cada iniciativa entrega por sprints, con un Product Owner del negocio.'});

  const rows = [];
  rows.push({grupo: true, n: 'Fases PMI de la palanca', ini: 'all', c: 'var(--navy)'});
  G.fases.forEach(f => rows.push({n: f.n, id: f.w, d: f.d, h: f.h, ph: true, w: f.n, ini: 'all', c: 'var(--navy)', e: f.p}));
  INI.forEach(x => {
    rows.push({grupo: true, n: `${x.num} · ${x.nombre}`, ini: x.id, c: col(x.id)});
    x.epicas.forEach(e => rows.push(Object.assign({}, e, {ini: x.id, c: col(x.id)})));
  });
  const ruta = sec('Hoja de ruta 2027', 'Épicas por trimestre y sus hitos', `${filters('rm')}${roadmap(rows)}
    <div class="legend a" style="--i:4"><span><i style="width:22px;height:10px;border-radius:3px;background:var(--core)"></i>Épica</span><span><i style="width:11px;height:11px;background:var(--gold);transform:rotate(45deg)"></i>Hito</span><span><i style="width:2px;height:16px;background:var(--gold)"></i>Hoy: ${esc(M.fecha)}</span></div>`,
    {lede: 'Fechas preliminares. Se fijan como línea base en la fase de Planificación y se revisan cada trimestre.'});

  const allK = G.kpis.map(k => Object.assign({ini: 'general'}, k)).concat(...INI.map(x => x.kpis.map(k => Object.assign({ini: x.id}, k))));

  const heat = [];

    for (let i = 1; i <= 3; i++){
      const rs = G.riesgos.filter(r => r.p === p && r.i === i);
      heat.push(`<div class="hc2 s${sevOf(p, i)}">${rs.map((r, k) => `<button class="rdot pop" data-r="${r.id}" style="--i:${k + p + i}" aria-label="${esc(r.id + ': ' + r.n)}">${r.id}</button>`).join('')}</div>`);

  const riesgos = sec('Riesgos', 'Lo que puede frenar el motor', `

      <div class="rlist">${G.riesgos.map((r, k) => { const s = sevOf(r.p, r.i); return `<div class="ritem a" data-r="${r.id}" style="--i:${3 + k}"><div><span class="rid">${r.id}</span><span class="sev s${s}">${SEVTXT[s]}</span></div><div><h4>${esc(r.n)}</h4><p>${esc(r.c)}</p><p class="mit"><b>Mitigación:</b> ${esc(r.m)}</p></div></div>`; }).join('')}</div>
    </div>`, {lede: 'Riesgos de toda la palanca. Los de cada iniciativa están en su charter.'});

  const tot25 = D.general.ppto2025.reduce((a, r) => a + r[1], 0);
  const max25 = Math.max(...D.general.ppto2025.map(r => r[1]));
  const ppto = sec('Presupuesto', 'Financiación 2027: pendiente de cierre', `
    <div class="alert a" style="--i:2"><span class="ic">!</span><span><b>No hay presupuesto 2027 aprobado.</b> Sin cerrarlo desde el portafolio, las iniciativas podrían arrancar sin financiación asegurada. Es la primera tarea de la fase de Inicio.</span></div>
    <div class="g2">
      <div class="card a" style="--i:3"><div class="ml">Presupuesto 2027 por iniciativa</div>
        <div class="tbl-wrap" style="border:0;border-radius:0;background:transparent"><table class="tbl" style="min-width:0"><thead><tr><th>Iniciativa</th><th>Qué incluye</th><th>COP</th></tr></thead>
        <tbody>${G.ppto2027.map(r => `<tr><td><span class="ini-pill" style="--lc:${col(r[0])}"><i></i>${esc(byId[r[0]].corto)}</span></td><td style="font-size:14px;color:var(--muted)">${esc(r[1])}</td><td><span class="tbd">Por definir</span></td></tr>`).join('')}</tbody></table></div>
      </div>
      <div class="card a" style="--i:4"><div class="ml">Referencia: presupuesto TI 2025 · COP</div>
        <div class="hb">${G.ppto2025.map((r, k) => `<div class="hb-r"><span class="l">${esc(r[0])}<small style="color:${r[2] ? 'var(--ok)' : 'var(--muted)'}">${r[2] ? 'Equivale a líneas del Motor' : 'Fuera del alcance del Motor'}</small></span><div class="t"><div class="f gx" style="width:${(r[1] / max25 * 100).toFixed(1)}%;background:${r[2] ? 'var(--blue)' : 'var(--blue-ll)'};--i:${k}"></div></div><span class="v">${fmtCOP(r[1])}</span></div>`).join('')}
          <div class="hb-tot"><span>Total 2025</span><span>${fmtCOP(tot25)}</span></div></div>
      </div>
    </div>`, {lede: 'En 2025, las líneas equivalentes al Motor (potenciación de herramientas e IA) sumaron 102,7 M COP de un total de 553,2 M COP.'});

  const sup = sec('Supuestos, restricciones y criterios de éxito', 'Las condiciones del charter', `
    <div class="g3">
      <div class="card a" style="--i:2"><div class="ml">Supuestos</div><ul class="ck">${G.supuestos.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>
      <div class="card a" style="--i:3;--bc:var(--warn)"><div class="ml">Restricciones</div><ul class="ck" style="--bc:var(--warn)">${G.restricciones.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>
      <div class="card a" style="--i:4"><div class="ml">Criterios de éxito</div><ul class="ck" style="--bc:var(--ok)">${G.exito.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>
    </div>`);

  const firmas = ['Patrocinador · Gerencia General', 'Director de la palanca · Líder ID&TI', 'Product Owners de las 4 iniciativas'];
  const cierre = sec('Validación y aprobación', 'Lo que falta para aprobar este charter', `
    <ol class="pend">${G.pendientes.map((p, k) => `<li class="a" style="--i:${2 + k}"><div><b>${esc(p[0])}</b><span>${esc(p[1])}</span></div></li>`).join('')}</ol>
    <div class="firmas">${firmas.map((f, k) => `<div class="firma a" style="--i:${9 + k}"><span class="st">Pendiente</span><span class="sl">${esc(f)}</span><span>Firma y fecha</span></div>`).join('')}</div>`,
    {lede: 'Con estas respuestas el charter pasa de borrador a Rev. A y su línea base queda fija.'});

  return hero + caso + mvo + alcance + modelo + ruta + kpis + riesgos + ppto + sup + cierre + nextBtn(INI[0].id);
}

/* ---------- Charter de iniciativa ---------- */
function panelIni(x, idx){
  const c = col(x.id);
  const hero = `<section class="band init" style="--c:${c}"><div class="inner"><div class="op">
    <div>
      <div class="num a">${x.num}</div>
      <h1 class="a" style="--i:1">${esc(x.nombre)}</h1>
      <p class="thesis a" style="--i:2">${esc(x.tesis)}</p>
      <div class="tags a" style="--i:3">${x.propuesta ? '<span class="tag prop">Propuesta</span>' : ''}${x.herramientas.map(h => `<span class="tag ghost">${esc(h)}</span>`).join('')}</div>
    </div>
    <div>
      <div class="glass a" style="--i:3"><div class="gl">Misión</div><p>${esc(x.mision)}</p></div>
      <div class="glass a" style="--i:4"><div class="gl">Visión <span>${esc(x.visionAno)}</span></div><p>${esc(x.vision)}</p></div>
      <div class="glass obj a" style="--i:5"><div class="gl">Objetivo <span>2027</span></div><p>${esc(x.objetivo)}</p></div>
    </div>
  </div></div></section>`;

  const ficha = sec(`Iniciativa ${+x.num} · Gobierno`, 'Quién decide y quién entrega', `
    <dl class="fi a" style="--i:2">${x.ficha.map(f => `<div><dt>${esc(f[0])} ${method(f[2])}</dt><dd>${tbd(f[1])}</dd></div>`).join('')}</dl>`, {c});

  const base = sec(`Iniciativa ${+x.num} · Línea base`, 'Desde dónde partimos', `
    <div class="g4">${x.base.map((b, k) => `<div class="tile a" style="--i:${2 + k}"><div class="big ${b.tono || ''}">${esc(b.v)}</div><p class="cap">${esc(b.t)}<small>${esc(b.s)}</small></p></div>`).join('')}</div>`, {c, lede: `Estado: ${esc(x.estado)}. Datos de los resúmenes ejecutivos de octubre de 2026.`});

  const alc = sec(`Iniciativa ${+x.num} · Alcance`, 'Qué incluye y qué no', `
    <div class="g2 scope">
      <div class="card a" style="--i:2;--hc:var(--ok)"><h3><i>✓</i>Incluye</h3><ul class="ck" style="--bc:var(--ok)">${x.incluye.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>
      <div class="card a" style="--i:3;--hc:var(--crit)"><h3><i>✕</i>No incluye</h3><ul class="ck" style="--bc:var(--crit)">${x.excluye.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>
    </div>`, {c});

  const qlab = ['Ini', 'T1', 'T2', 'T3', 'T4'];
  const back = sec(`Iniciativa ${+x.num} · Backlog 2027`, 'Épicas, en orden de prioridad', `
    <div class="epics">${x.epicas.map((e, k) => `<div class="epic a" style="--i:${2 + k}">
      <div class="et"><div><span class="eid">${e.id}</span><h4>${esc(e.n)}</h4></div><span class="prio p${e.p}">${e.p === 1 ? 'Debe' : 'Debería'}</span></div>
      <p><b>Entregable:</b> ${esc(e.e)}</p>
      <div><div class="qs">${qlab.map((q, j) => `<span class="${j >= e.d && j <= e.h ? 'act gx' : ''}" style="--i:${j}"></span>`).join('')}</div>
      <div class="qs-l" style="margin-top:5px">${qlab.map(q => `<span>${q}</span>`).join('')}</div></div>
      ${e.hito ? `<span class="hito"><i></i>Hito: ${esc(e.hito)}</span>` : ''}
    </div>`).join('')}</div>`, {c, lede: 'El Product Owner puede reordenar el backlog en cada revisión trimestral. Cada épica se parte en historias al planificar el sprint.'});

  const kp = sec(`Iniciativa ${+x.num} · Indicadores`, 'Cómo se mide el valor', kpiTable(x.kpis.map(k => Object.assign({ini: x.id}, k)), false), {c});

  const rf = sec(`Iniciativa ${+x.num} · Riesgos y factores de éxito`, 'Qué puede salir mal y qué lo evita', `
    <div class="rf">
      <div class="rf-col r"><div class="rf-h a" style="--i:2"><i>!</i>Riesgos</div>
        ${x.riesgos.map((r, k) => `<div class="rfi a" style="--i:${3 + k}"><div><h4>${esc(r[0])}</h4><p>${esc(r[1])}</p><p class="mit"><b>Mitigación:</b> ${esc(r[2])}</p></div></div>`).join('')}</div>
      <div class="rf-col f"><div class="rf-h a" style="--i:2"><i>✓</i>Factores de éxito</div>
        ${x.exito.map((r, k) => `<div class="rfi a" style="--i:${3 + k}"><div><h4>${esc(r[0])}</h4><p>${esc(r[1])}</p></div></div>`).join('')}</div>
    </div>`, {c});

  const nxt = idx < INI.length - 1 ? nextBtn(INI[idx + 1].id) : nextBtn('motor');
  return hero + ficha + base + alc + back + kp + rf + nxt;
}

/* ---------- Montaje ---------- */
$('#tabs').innerHTML = TABS.map((t, k) => `<button class="tab" role="tab" id="t-${t.id}" data-tab="${t.id}" aria-controls="p-${t.id}" aria-selected="${k === 0}" ${k ? 'tabindex="-1"' : ''} style="--tc:${t.c}"><i></i>${esc(t.label)}</button>`).join('');
$('#app').innerHTML = `<div class="panel" id="p-motor" role="tabpanel" aria-labelledby="t-motor">${panelMotor()}</div>` +
  INI.map((x, k) => `<div class="panel" id="p-${x.id}" role="tabpanel" aria-labelledby="t-${x.id}" hidden>${panelIni(x, k)}</div>`).join('');
$('#brand-sub').textContent = `Grupo HL · ${M.revision} · ${M.fecha}`;
$('#foot').textContent = `Dirección de Innovación Digital & TI · ${M.revision} · ${M.estado} · Fuentes: Palanca Motor Tecnológico (resúmenes ejecutivos de Libra, Procore, Transformación Digital e IA, 16-oct-2026) y Project Charter TI 2025 Rev. B. Metas «Por definir», fechas y valoración de riesgos son preliminares.`;

/* Filtros (hoja de ruta e indicadores) */
$$('.filters').forEach(fg => {
  const target = fg.dataset.group === 'rm' ? fg.parentElement.querySelectorAll('.rm-row:not(.rm-h)') : fg.parentElement.querySelectorAll('.kpi-tbl tbody tr');
  fg.addEventListener('click', e => {
    const b = e.target.closest('.fb'); if (!b) return;
    $$('.fb', fg).forEach(x => x.setAttribute('aria-pressed', x === b));
    const f = b.dataset.f;
    target.forEach(r => { const ini = r.dataset.ini; r.hidden = !(f === 'all' || ini === f || ini === 'all' || (fg.dataset.group === 'kpi' && ini === 'general' && f === 'all')); });
  });
});

/* Matriz de riesgos ↔ lista */
function hl(id, on){ $$(`[data-r="${id}"]`).forEach(el => el.classList.toggle('hl', on)); }
$$('.rdot').forEach(d => {
  d.addEventListener('mouseenter', () => hl(d.dataset.r, true));
  d.addEventListener('mouseleave', () => hl(d.dataset.r, false));
  d.addEventListener('focus', () => hl(d.dataset.r, true));
  d.addEventListener('blur', () => hl(d.dataset.r, false));
  d.addEventListener('click', () => { const it = $(`.ritem[data-r="${d.dataset.r}"]`); if (it) it.scrollIntoView({behavior: RM ? 'auto' : 'smooth', block: 'center'}); });
});
$$('.ritem').forEach(it => { it.addEventListener('mouseenter', () => hl(it.dataset.r, true)); it.addEventListener('mouseleave', () => hl(it.dataset.r, false)); });

/* Contadores */
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
function countUp(scope){ if (RM) return;
  $$('.cnt[data-n]', scope).forEach(el => { const to = +el.dataset.n, t0 = performance.now() + 300, dur = 1000;
    const st = t => { const p = Math.max(0, Math.min(1, (t - t0) / dur)), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(to * e); if (p < 1) requestAnimationFrame(st); else el.textContent = fmt(to); };
    requestAnimationFrame(st); });
}

/* Animación al entrar en pantalla */
let io = null;
function observe(panel){
  if (io) io.disconnect();
  const secs = $$('.sec, .band', panel);
  secs.forEach(s => s.classList.remove('on'));
  if (!('IntersectionObserver' in window) || RM) return;
  io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting && !en.target.classList.contains('on')) { en.target.classList.add('on'); countUp(en.target); io.unobserve(en.target); } }), {threshold: 0.12});
  requestAnimationFrame(() => secs.forEach(s => io.observe(s)));
}

/* Pestañas */
const tabs = $$('.tab'), ids = tabs.map(t => t.dataset.tab);
function show(id, o={}){
  if (ids.indexOf(id) < 0) id = ids[0];
  tabs.forEach(t => { const on = t.dataset.tab === id; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; });
  $$('.panel').forEach(p => { p.hidden = p.id !== 'p-' + id; });
  const at = tabs.find(t => t.dataset.tab === id), cont = at.parentElement;
  if (at.offsetLeft < cont.scrollLeft || at.offsetLeft + at.offsetWidth > cont.scrollLeft + cont.clientWidth) cont.scrollLeft = at.offsetLeft - 16;
  if (o.scroll) window.scrollTo({top: 0, behavior: 'auto'});
  if (o.hash) { try { history.replaceState(null, '', '#' + id); } catch (e) {} }
  observe($('#p-' + id));
}
tabs.forEach((t, i) => {
  t.addEventListener('click', () => show(t.dataset.tab, {hash: 1, scroll: 1}));
  t.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length]; n.focus(); n.click(); } });
});
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) show(b.dataset.go, {hash: 1, scroll: 1}); });
const h0 = (location.hash || '').slice(1);
show(ids.indexOf(h0) >= 0 ? h0 : ids[0]);
window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (ids.indexOf(k) >= 0) show(k, {scroll: 1}); });
})();
</script>
