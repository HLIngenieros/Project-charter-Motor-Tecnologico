<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Charter · Motor Tecnológico</title>
  <meta name="description" content="Dashboard del Project Charter 2027 de la palanca Motor Tecnológico de Grupo HL: charter principal y uno por iniciativa, con enfoque híbrido PMI + Scrum.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">

  <!-- Tailwind (CDN) con la paleta de la identidad visual -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { DEFAULT: '#0B2A4A', 700: '#123B66', 900: '#071C33' },
            gold: { DEFAULT: '#C08A1E', soft: '#F5E3B8' },
            ink: '#0E1C2B',
            muted: '#5A6B80',
            line: '#DDE3EA',
            surface: '#F4F6F9',
            crit: '#B3261E',
            warn: '#B5651D',
            ok: '#2C7A4B',
            ini: { core: '#1D4F86', datos: '#0A6C87', ia: '#4A4C9C', vigilancia: '#2B7A66' }
          },
          fontFamily: {
            display: ['Archivo', '"Arial Narrow"', 'system-ui', 'sans-serif'],
            sans: ['"Source Sans 3"', '"Segoe UI"', 'system-ui', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'Consolas', 'monospace']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-surface text-ink font-sans antialiased">

  <div class="min-h-screen lg:flex">

    <!-- Barra lateral: pestañas de los charters -->
    <aside class="sidebar hidden lg:flex lg:flex-col w-72 shrink-0 h-screen sticky top-0 text-white">
      <div class="px-6 pt-7 pb-6 border-b border-white/10">
        <div class="flex items-center gap-3">
          <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="21" fill="none" stroke="#1D4F86" stroke-width="4" stroke-dasharray="40 26" class="ring-a"/>
            <circle cx="24" cy="24" r="14" fill="none" stroke="#4A4C9C" stroke-width="4" stroke-dasharray="26 18" class="ring-b"/>
            <circle cx="24" cy="24" r="6" fill="#C08A1E"/>
          </svg>
          <div>
            <p class="font-display font-extrabold text-lg leading-none" style="font-stretch:82%">Motor Tecnológico</p>
            <p class="font-mono text-[11px] text-white/55 mt-1 tracking-wide">GRUPO HL · ID&amp;TI</p>
          </div>
        </div>
      </div>
      <p class="px-6 pt-6 pb-2 text-[11px] font-semibold uppercase tracking-[.16em] text-white/45">Project Charters</p>
      <nav id="side-nav" class="flex flex-col gap-1 px-3" role="tablist" aria-label="Charters"></nav>
      <div id="side-foot" class="mt-auto px-6 py-5 border-t border-white/10 text-xs text-white/55 leading-relaxed"></div>
    </aside>

    <!-- Contenido -->
    <div class="flex-1 min-w-0">
      <header class="topbar sticky top-0 z-30">
        <!-- Pestañas en móvil y tableta -->
        <nav id="top-nav" class="lg:hidden flex gap-1 overflow-x-auto no-scrollbar px-4 pt-3" role="tablist" aria-label="Charters"></nav>
        <div class="px-4 md:px-8 py-3 flex flex-wrap items-center gap-x-6 gap-y-2">
          <div class="min-w-0">
            <p class="text-xs text-muted font-semibold tracking-wide">Project Charter <span class="text-line">/</span> <span id="crumb" class="text-ink"></span></p>
          </div>
          <div class="ml-auto flex flex-wrap items-center gap-x-4 gap-y-2">
            <label class="corte-ctl" title="El % planeado se calcula a esta fecha. El % real es el del último corte registrado en o antes de ella.">
              <span>Fecha de corte</span>
              <input type="date" id="corte-input">
              <b id="corte-sem"></b>
            </label>
            <span class="status-pill"><i></i><span id="estado"></span></span>
            <span id="rev" class="font-mono text-xs text-muted"></span>
          </div>
          <nav id="sec-nav" class="w-full flex gap-2 overflow-x-auto no-scrollbar pb-1" aria-label="Secciones"></nav>
        </div>
      </header>

      <main id="app" class="px-4 md:px-8 pb-16 pt-6"></main>

      <footer id="foot" class="px-4 md:px-8 pb-10 text-xs text-muted leading-relaxed max-w-5xl"></footer>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Datos: contenido del charter, línea base del cronograma y avance real por corte -->
  <script src="js/datos.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/avance.js"></script>
  <!-- Lógica: fórmulas de avance y dibujo del dashboard -->
  <script src="js/calculo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
