  <script>
    const B = 60 / 112;
    const tl = gsap.timeline({ paused: true });
    // La matriz es réplica estática: 25 celdas con el color de su nivel (probabilidad × impacto).
    let celdas = "";
    for (let p = 5; p >= 1; p--) for (let i = 1; i <= 5; i++) {
      const n = p * i, nivel = n >= 16 ? "critico" : n >= 10 ? "alto" : n >= 5 ? "medio" : "bajo";
      celdas += `<div class="cm-celda cm-${nivel}" data-d="${i + (5 - p)}" style="left:${110 + (i - 1) * 108}px; top:${110 + (5 - p) * 108}px"></div>`;
    }
    document.querySelector("#cm-celdas").innerHTML = celdas;

    // Golpe 0: entra desde abajo (sigue la salida de la curva S).
    tl.fromTo("#cm-entrada", { y: 130, opacity: 0 }, { y: 0, opacity: 1, duration: 0.85, ease: "power3.out" }, 0);
    tl.fromTo("#cm-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1 * B);
    // La cámara recorre de la matriz al presupuesto.
    tl.fromTo("#cm-camara", { scale: 1.07, x: 60 }, { x: -60, duration: 7 * B, ease: "power1.inOut" }, 0);
    // Golpes 0,3 a 1,5: las celdas se encienden en diagonal.
    document.querySelectorAll(".cm-celda").forEach((c) => {
      tl.fromTo(c, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 0.4 * B + Number(c.dataset.d) * 0.055);
    });
    // Golpes 1,5 a 3,5: los riesgos caen en su celda, uno cada medio golpe.
    [1, 2, 3, 4, 5].forEach((n, k) => {
      tl.fromTo("#cm-p" + n, { opacity: 0, y: -36, scale: 1.25 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, (1.5 + k * 0.5) * B - 0.1);
    });
    tl.fromTo("#cm-nota", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.6 * B);
    // Golpe 4 (acento de la música): el total cuenta y las barras de los rubros crecen.
    const el = document.querySelector("#cm-n"), v = { n: 0 };
    tl.fromTo(v, { n: 0 }, {
      n: 50, duration: 1.6 * B, ease: "power3.out",
      onUpdate: () => { el.textContent = (Math.round(v.n * 10) * 100000).toLocaleString("de-DE"); },
    }, 4 * B);
    tl.fromTo("#cm-total", { opacity: 0, scale: 0.9, transformOrigin: "0% 60%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 4 * B);
    tl.fromTo(".cm-barra", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power3.inOut", stagger: 0.12 }, 4 * B);
    tl.fromTo(".cm-valor", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", stagger: 0.12 }, 4.4 * B);

    tl.fromTo("#cm-entrada", { scale: 1, opacity: 1 }, { scale: 0.88, opacity: 0, duration: 0.5, ease: "power2.inOut", immediateRender: false }, 8 * B - 0.36);
    window.__timelines["complementos"] = tl;
