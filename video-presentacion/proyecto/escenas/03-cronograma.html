<template>

    .cr-grupo .cr-barra { top: 25px; height: 10px; border-radius: 5px; background: var(--tinta); }
    .cr-ok { background: var(--ok); }
    .cr-pend { background: var(--barra); }
    .cr-curso { background: var(--naranja-suave); border: 2px solid var(--naranja); }
    .cr-curso i { position: absolute; left: 0; top: 0; bottom: 0; width: 20%; background: var(--naranja); }
    #cr-corte { position: absolute; left: 1309px; top: 0; width: 4px; height: 650px; background: var(--acento); transform-origin: 50% 0; }
    #cr-corte-texto {
      position: absolute; left: 1322px; top: 13px; font-family: var(--font-texto); font-weight: 700; font-size: 22px;

  </style>
  <div id="root" data-composition-id="cronograma" data-width="1920" data-height="1080">
    <div id="cr-cuadro" class="clip" data-start="0" data-duration="8.5714">
      <div id="cr-camara">
        <h1 id="cr-titulo" class="t-titulo">Cronograma que se arrastra</h1>
        <p id="cr-sub" class="t-sub">Fechas encadenadas y pesos claros</p>
        <div id="cr-pesos">
          <b>Pesos:</b> proyecto 100&nbsp;%
          <svg id="cr-check" viewBox="0 0 24 24" fill="none" stroke="#15a06a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5" /></svg>
        </div>
        <div id="cr-aviso">Se corrieron 5 actividades <b>Deshacer</b></div>
        <div id="cr-tarjeta" class="tarjeta">
          <div class="cr-div" style="left:1110px"></div><div class="cr-div" style="left:1223px"></div>
          <div class="cr-div" style="left:1332px"></div><div class="cr-div" style="left:1446px"></div>
          <div class="cr-div" style="left:1559px"></div><div class="cr-div" style="left:980px"></div>
          <div id="cr-filas"></div>
          <div id="cr-cabecera">
            <span style="left:28px">Ítem</span><span style="left:110px">Actividad</span>
            <span style="left:640px">Peso</span><span style="left:748px">Inicio</span><span style="left:868px">Fin</span>
            <span class="cr-mes" style="left:1010px">sep</span><span class="cr-mes" style="left:1120px">oct</span>
            <span class="cr-mes" style="left:1233px">nov</span><span class="cr-mes" style="left:1342px">dic</span>
            <span class="cr-mes" style="left:1456px">ene</span><span class="cr-mes" style="left:1569px">feb</span>
          </div>
          <div id="cr-corte"></div>
          <div id="cr-corte-texto" data-layout-allow-overlap>25 nov</div>
        </div>
        <svg id="cr-cursor" viewBox="0 0 24 24"><path d="M4 2l15 9.5-6.6 1.4L16 20l-3 1.4-3.5-7L5 18.5z" fill="#0b1f33" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" /></svg>
      </div>
    </div>
  </div>
  <script>
    const B = 60 / 112;
    const tl = gsap.timeline({ paused: true });
    // [ítem, nombre, peso, inicio, fin, x de la barra, ancho, tipo, inicio nuevo, fin nuevo, cómo cambia]
    const FILAS = [
      ["1", "Análisis", "15 %", "1 sep", "9 oct", 0, 139, "grupo"],
      ["1.1", "Levantamiento", "50 %", "1 sep", "18 sep", 0, 62, "ok"],
      ["1.2", "Diseño de la solución", "50 %", "21 sep", "9 oct", 73, 66, "ok"],
      ["2", "Construcción", "45 %", "12 oct", "8 ene", 150, 321, "grupo", null, "22 ene", "estira"],
      ["2.1", "Registro de proveedores", "35 %", "12 oct", "6 nov", 150, 91, "ok", null, "20 nov", "estira"],
      ["2.2", "Carga de documentos", "35 %", "9 nov", "4 dic", 252, 91, "curso", "23 nov", "18 dic", "corre"],
      ["2.3", "Tablero de seguimiento", "30 %", "7 dic", "8 ene", 354, 117, "pend", "21 dic", "22 ene", "corre"],
      ["3", "Pruebas", "20 %", "11 ene", "12 feb", 482, 117, "grupo", "25 ene", "26 feb", "corre"],
      ["3.1", "Pruebas internas", "50 %", "11 ene", "29 ene", 482, 66, "pend", "25 ene", "12 feb", "corre"],
      ["3.2", "Piloto", "50 %", "1 feb", "12 feb", 559, 40, "pend", "15 feb", "26 feb", "corre"],
    ];
    // Las filas son réplica estática: se arman una vez, antes de la línea de tiempo.
    document.querySelector("#cr-filas").innerHTML = FILAS.map((f, i) => {
      const grupo = f[7] === "grupo";
      const fecha = (clase, viejo, nuevo) =>
        `<span class="cr-fecha ${clase} cr-v" id="cr-${clase}v${i}">${viejo}</span>` +
        (nuevo ? `<span class="cr-fecha ${clase} cr-n" id="cr-${clase}n${i}">${nuevo}</span>` : "");
      return `<div class="cr-fila${grupo ? " cr-grupo" : ""}" id="cr-f${i}" style="top:${56 + i * 59}px">
        <div class="cr-luz" id="cr-l${i}"></div>
        <span class="cr-item">${f[0]}</span><span class="cr-nombre">${f[1]}</span><span class="cr-peso">${f[2]}</span>
        ${fecha("cr-ini", f[3], f[8])}${fecha("cr-fin", f[4], f[9])}
        <div class="cr-barra ${grupo ? "" : "cr-" + f[7]}" id="cr-b${i}" style="left:${1000 + f[5]}px; width:${f[6]}px">${f[7] === "curso" ? "<i></i>" : ""}</div>
      </div>`;
    }).join("");

    // Golpe 0: la escena sube desde abajo (sigue el movimiento de salida de la escena 2).
    tl.fromTo("#cr-camara", { y: 260, opacity: 0, scale: 1, transformOrigin: "1300px 620px" }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0);
    tl.fromTo("#cr-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1 * B);
    // Golpes 0,5 a 3: las filas entran en cascada y sus barras crecen.
    FILAS.forEach((f, i) => {
      tl.fromTo("#cr-f" + i, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.5 * B + i * 0.07);
      tl.fromTo("#cr-b" + i, { scaleX: 0, x: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 1.5 * B + i * 0.07);
    });
    // Golpes 5 a 6,5: la cámara se acerca a las barras; el cursor llega al fin de «Registro de proveedores».
    tl.fromTo("#cr-camara", { scale: 1 }, { scale: 1.28, duration: 1.5 * B, ease: "power2.inOut", immediateRender: false }, 5 * B);
    tl.fromTo("#cr-titulo", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.in" }, 5 * B);
    tl.fromTo("#cr-sub", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false }, 5 * B);
    tl.fromTo("#cr-titulo, #cr-sub", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, 11.6 * B);
    tl.fromTo("#cr-cursor", { x: 1640, y: 900, opacity: 0, scale: 1 }, { x: 1356, y: 616, opacity: 1, duration: 2 * B, ease: "power2.inOut" }, 5.5 * B);
    tl.fromTo("#cr-cursor", { scale: 1 }, { scale: 0.82, duration: 0.15, ease: "power2.out", immediateRender: false }, 7.6 * B);
    // Golpe 8 (acento de la música): arrastra el fin; las de abajo se corren los mismos días.
    const D = 51;
    tl.fromTo("#cr-cursor", { x: 1356 }, { x: 1356 + D, duration: 0.5, ease: "power3.out", immediateRender: false }, 8 * B);
    FILAS.forEach((f, i) => {
      if (!f[10]) return;
      const t = 8 * B + (i - 3) * 0.05;
      if (f[10] === "estira") {
        tl.fromTo("#cr-b" + i, { scaleX: 1 }, { scaleX: (f[6] + D) / f[6], duration: 0.5, ease: "power3.out", immediateRender: false }, 8 * B);
      } else {
        tl.fromTo("#cr-b" + i, { x: 0 }, { x: D, duration: 0.55, ease: "power3.out", immediateRender: false }, t);
      }
      tl.fromTo("#cr-l" + i, { opacity: 0.2 }, { opacity: 0, duration: 1.4, ease: "power2.out", immediateRender: false }, t);
      ["cr-ini", "cr-fin"].forEach((c, k) => {
        if (!f[8 + k]) return;
        tl.fromTo(`#cr-${c}v${i}`, { opacity: 1, y: 0 }, { opacity: 0, y: -14, duration: 0.2, ease: "power2.in" }, t);
        tl.fromTo(`#cr-${c}n${i}`, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t + 0.15);
      });
    });
    // Golpe 9,5: suelta y se va; entra el aviso con «Deshacer».
    tl.fromTo("#cr-cursor", { scale: 0.82 }, { scale: 1, duration: 0.15, ease: "power2.out", immediateRender: false }, 9.4 * B);
    tl.fromTo("#cr-cursor", { opacity: 1, y: 616 }, { opacity: 0, y: 700, duration: 0.5, ease: "power2.in", immediateRender: false }, 10 * B);
    tl.fromTo("#cr-aviso", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 9.5 * B);
    // Golpes 11 a 12,5: la cámara se aleja; golpe 12: los pesos cierran en 100 %.
    tl.fromTo("#cr-camara", { scale: 1.28 }, { scale: 1, duration: 1.5 * B, ease: "power2.inOut", immediateRender: false }, 11 * B);
    tl.fromTo("#cr-pesos", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 12 * B);
    tl.fromTo("#cr-check path", { strokeDasharray: 30, strokeDashoffset: 30 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 12.6 * B);
    // Golpe 13: cae la línea de corte.
    tl.fromTo("#cr-corte", { scaleY: 0 }, { scaleY: 1, duration: 0.45, ease: "power3.out" }, 13 * B);
    tl.fromTo("#cr-corte-texto", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 13.4 * B);
    // Golpes 14,6 a 16: la cámara entra por la actividad que cruza el corte (la escena 4 nace de ahí).
    tl.fromTo("#cr-camara", { scale: 1, x: 0, y: 0, opacity: 1 }, { scale: 2.6, x: -350, y: -130, duration: 1.4 * B, ease: "power3.in", immediateRender: false }, 14.6 * B);
    tl.fromTo("#cr-camara", { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "power1.in", immediateRender: false }, 16 * B - 0.24);
    window.__timelines["cronograma"] = tl;
  </script>
</template>
